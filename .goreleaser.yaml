# GoReleaser 配置：完整 GOOS/GOARCH 矩阵，排除工具链或依赖不支持的目标。
version: 2

project_name: lift

before:
  hooks:
    # 发布前统一下载依赖，避免并行构建重复拉取模块。
    - go mod download

builds:
  - id: lift
    main: .
    binary: lift
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/LiStudioorg/lift/internal/version.Version={{ .Tag }}
      - -X github.com/LiStudioorg/lift/internal/version.GitCommit={{ .Commit }}
      - -X github.com/LiStudioorg/lift/internal/version.BuiltAt={{ .Date }}
    goos:
      - aix
      - android
      - darwin
      - dragonfly
      - freebsd
      - illumos
      - js
      - linux
      - netbsd
      - openbsd
      - plan9
      - solaris
      - wasip1
      - windows
    goarch:
      - 386
      - amd64
      - arm
      - arm64
      - loong64
      - mips
      - mips64
      - mips64le
      - mipsle
      - ppc64
      - ppc64le
      - riscv64
      - s390x
      - wasm
    ignore:
      # 排除 iOS（不在 goos 矩阵中，保留以明确发布约束）。
      - goos: ios
        goarch: amd64
      - goos: ios
        goarch: arm64
      # 排除 Go 工具链不支持的 GOOS/GOARCH 组合。
